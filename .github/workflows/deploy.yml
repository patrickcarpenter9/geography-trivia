# Builds the game and publishes it to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The minimum permissions this workflow needs: read the code, publish to Pages,
# and prove its identity to Pages (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the first deploy instead of running two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs the exact versions in package-lock.json
      # (a clean, repeatable install; better than `npm install` for automation).
      - name: Install dependencies
        run: npm ci

      # If a test fails, the workflow stops here and the live site is left alone.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
